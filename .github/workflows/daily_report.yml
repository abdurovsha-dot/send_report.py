name: Send Daily Qarzdorlik Report

on:
  schedule:
    # Har kuni Toshkent vaqti bilan soat 16:00 da (UTC 11:00)
    - cron: '0 11 * * *'
  workflow_dispatch: # Qo'lda tekshirib ko'rish tugmasi

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: |
          pip install telethon pandas openpyxl requests

      - name: Hisobotni shaxsiy profildan yuborish
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          TARGET_USER: ${{ secrets.TARGET_USER }}
        run: |
          python send_report.py
