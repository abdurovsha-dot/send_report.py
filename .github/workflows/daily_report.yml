name: Send Daily Qarzdorlik Report

on:
  schedule:
    # Har kuni Toshkent vaqti bilan soat 16:00 da (UTC 11:00)
    - cron: '0 11 * * *'
  workflow_dispatch: # Istalgan vaqtda qo'lda ishga tushirib ko'rish imkoniyati

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kerakli kutubxonalarni o'rnatish
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Skriptni ishga tushirish
        run: |
          python send_report.py
